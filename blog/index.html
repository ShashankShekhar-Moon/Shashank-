<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" id="metaDescription" content="A public blog by Shashank Shekhar — ideas, experiments, technology and things worth keeping.">
<title id="pageTitle">Shashank — Blog</title>
<style>
:root{color-scheme:dark;--bg:#050505;--surface:#090a09;--surface2:#0d0e0d;--ink:#f4f4ef;--soft:#a4a7a0;--muted:#70766e;--line:#252925;--line2:#343934;--accent:#b8ff4a;--accent2:#7db72e}
body.light{color-scheme:light;--bg:#f3f4ef;--surface:#eef0eb;--surface2:#fff;--ink:#171a17;--soft:#555c55;--muted:#697069;--line:#cbd0c8;--line2:#aeb6aa;--accent:#5f8f20;--accent2:#729f32}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}button,input{font:inherit}button{cursor:pointer}::selection{background:var(--accent);color:var(--bg)}
.shell{width:min(1040px,88vw);margin:0 auto}.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;background:rgba(5,5,5,.94);backdrop-filter:blur(14px)}body.light .topbar{background:rgba(243,244,239,.94)}.brand{font-weight:950;letter-spacing:-.06em}.brand span{color:var(--accent)}.top-actions{display:flex;gap:8px;align-items:center}.ui-btn{min-height:38px;border:1px solid var(--line2);background:transparent;color:var(--soft);padding:0 12px;border-radius:5px;font:800 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;text-transform:uppercase}.ui-btn:hover,.ui-btn:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}.hero{padding:88px 0 70px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font:900 10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(4rem,11vw,8.8rem);line-height:.82;letter-spacing:-.1em;margin:22px 0 0;max-width:920px}.hero h1 span{color:var(--accent)}.intro{max-width:760px;color:var(--soft);font-size:clamp(1rem,1.8vw,1.18rem);line-height:1.85;margin:30px 0 0}.hero-meta{display:flex;flex-wrap:wrap;gap:18px;margin-top:28px;color:var(--muted);font:800 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.hero-meta strong{color:var(--ink)}
.section{padding:72px 0}.section-label{color:var(--accent);font:900 9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}.featured{border-top:1px solid var(--line);padding-top:26px}.featured-link{display:block}.featured-link:hover .featured-title{color:var(--accent)}.featured-title{font-size:clamp(2.7rem,6vw,5.8rem);line-height:.95;letter-spacing:-.08em;margin:0;transition:.18s}.excerpt{max-width:760px;color:var(--soft);font-size:1.05rem;line-height:1.75;margin:20px 0 0}.meta{display:flex;flex-wrap:wrap;gap:11px;align-items:center;color:var(--muted);font:800 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:18px}.dot{color:var(--accent)}.featured-cover,.post-cover{margin-top:28px;border:1px solid var(--line);background:var(--surface);overflow:hidden}.featured-cover img,.featured-cover video,.post-cover img,.post-cover video{display:block;width:100%;max-height:560px;object-fit:cover}.cover-empty{min-height:190px;display:grid;place-items:center;color:var(--accent);font:950 60px ui-monospace,monospace;letter-spacing:-.12em;background:radial-gradient(circle at 75% 30%,rgba(184,255,74,.11),transparent 42%)}
.posts-head{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:18px}.posts-head h2{margin:0;font-size:clamp(2.2rem,5.4vw,4.5rem);line-height:.9;letter-spacing:-.08em}.post-count{color:var(--muted);font:800 9px ui-monospace,monospace;letter-spacing:.12em}.tools{display:flex;gap:8px;align-items:center;margin:22px 0 8px;flex-wrap:wrap}.search{flex:1 1 300px;min-height:42px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:0 13px;border-radius:5px;outline:none;font-size:16px}.search:focus{border-color:var(--accent)}.filter{min-height:42px;border:1px solid var(--line2);background:var(--surface);color:var(--soft);padding:0 12px;border-radius:5px;font:800 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.filter:focus{outline:none;border-color:var(--accent);color:var(--accent)}.post{display:grid;grid-template-columns:120px 1fr;gap:30px;padding:28px 0;border-bottom:1px solid var(--line)}.post-number{color:var(--muted);font:900 10px ui-monospace,monospace;letter-spacing:.12em}.post-date{display:block;margin-top:6px;line-height:1.4}.post-link{display:block}.post-link:hover .post-title{color:var(--accent)}.post-title{font-size:clamp(1.7rem,3.2vw,2.8rem);line-height:1.02;letter-spacing:-.055em;margin:0;transition:.18s}.post-excerpt{color:var(--soft);margin:9px 0 0;line-height:1.65}.empty{border-top:1px solid var(--line);padding:28px 0;color:var(--muted)}
.about{padding:70px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.about-grid{display:grid;grid-template-columns:180px 1fr;gap:50px}.about-label{color:var(--accent);font:900 9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.about-copy{color:var(--soft);font-size:1.05rem;line-height:1.85}.about-copy p{margin:0 0 18px}.about-copy p:last-child{margin-bottom:0}footer{padding:34px 0 55px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap}footer strong{color:var(--ink)}
.reader{position:fixed;inset:0;z-index:100;display:none;overflow:auto;background:var(--bg)}.reader.open{display:block}.readerbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:2;background:rgba(5,5,5,.96);backdrop-filter:blur(14px)}body.light .readerbar{background:rgba(243,244,239,.96)}.article{width:min(780px,88vw);margin:auto;padding:70px 0 110px}.article h1{font-size:clamp(3rem,8vw,6.8rem);line-height:.86;letter-spacing:-.09em;margin:18px 0}.article .excerpt{font-size:1.15rem}.article-content{padding-top:24px}.article-content p{color:var(--soft);font-size:1.08rem;line-height:1.95;margin:28px 0}.article-content h2{font-size:2rem;line-height:1;letter-spacing:-.05em;margin:54px 0 14px}.article-content h3{font-size:1.35rem;margin:40px 0 12px}.article-content blockquote{border-left:2px solid var(--accent);padding-left:20px;color:var(--ink);font-size:1.16rem;line-height:1.75;margin:40px 0}.article-content ul,.article-content ol{color:var(--soft);padding-left:24px;line-height:1.9}.article-content img,.article-content video{width:100%;display:block;max-height:720px;object-fit:contain;background:#000;border:1px solid var(--line);margin:34px 0}.article-content audio{display:block;width:100%;margin:34px 0}.caption{color:var(--muted);font:700 9px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;margin-top:-22px;margin-bottom:34px}.file-card{border:1px solid var(--line);background:var(--surface);padding:16px;margin:28px 0}.file-card strong{display:block}.file-card small{display:block;color:var(--muted);margin-top:4px}.download{display:inline-block;margin-top:12px;border:1px solid var(--line2);padding:9px 12px;font:800 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase}.download:hover{border-color:var(--accent);color:var(--accent)}.pdf{display:block;width:100%;height:min(72vh,700px);border:1px solid var(--line);background:#fff;margin-top:14px}.article-nav{display:flex;justify-content:space-between;gap:14px;margin-top:70px;padding-top:20px;border-top:1px solid var(--line)}.article-nav a{color:var(--soft);font-size:.92rem}.article-nav a:hover{color:var(--accent)}.error{border:1px solid var(--line);padding:24px;color:var(--soft);background:var(--surface)}
@media(max-width:700px){.shell{width:88vw}.topbar,.readerbar{height:64px}.hero{padding:72px 0 58px}.post{grid-template-columns:1fr;gap:8px}.post-date{display:inline;margin-left:10px}.about-grid{grid-template-columns:1fr;gap:18px}.posts-head{align-items:flex-start;flex-direction:column}.article{padding-top:50px}.top-actions .ui-btn:first-child{display:none}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="../">SHASHANK<span>.</span></a><div class="top-actions"><a class="ui-btn" href="../">MAIN SITE</a><button class="ui-btn" id="themeBtn" type="button">LIGHT MODE</button></div></header>
<main>
<section class="hero"><div class="shell"><div class="eyebrow">A PUBLIC BLOG BY SHASHANK SHEKHAR</div><h1>IDEAS.<br><span>EXPERIMENTS.</span><br>OBSERVATIONS.</h1><p class="intro" id="intro"></p><div class="hero-meta"><span>POSTS <strong id="count">0</strong></span><span>LATEST <strong id="latest">—</strong></span><span>WORDS, WORK & CURIOSITY</span></div></div></section>
<section class="section"><div class="shell"><div class="section-label">01 / FEATURED</div><div id="featured"></div></div></section>
<section class="section" id="postsSection"><div class="shell"><div class="posts-head"><h2>ALL POSTS.</h2><div class="post-count" id="postCount">0 POSTS</div></div><div class="tools"><input class="search" id="search" type="search" placeholder="Search posts…" aria-label="Search posts"><select class="filter" id="category"><option value="all">All categories</option></select></div><div id="posts"></div></div></section>
<section class="about"><div class="shell about-grid"><div class="about-label">ABOUT THIS BLOG</div><div class="about-copy" id="about"></div></div></section>
</main>
<footer class="shell"><div><strong>Shashank Shekhar</strong> · A little corner of the internet.</div><div>© <span id="year"></span></div></footer>
<div class="reader" id="reader" aria-hidden="true"><div class="readerbar"><a class="brand" href="../">SHASHANK<span>.</span></a><button class="ui-btn" id="closeBtn" type="button">← BACK TO POSTS</button></div><article class="article" id="article"></article></div>
<script>
(function(){
'use strict';
const DATA_URL='blogs.json';
const $=id=>document.getElementById(id);
let site={};let settings={};let posts=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(v){const s=String(v??'').trim();return /^(https?:|mailto:|#|\/|\.\/|\.\.\/|[A-Za-z0-9_\-.~/%]+$)/.test(s)?s:'';}
function dateObj(v){const d=new Date(String(v||'')+'T00:00:00');return Number.isNaN(d.getTime())?null:d;}
function dateLong(v){const d=dateObj(v);return d?d.toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'}):'—';}
function dateShort(v){const d=dateObj(v);return d?d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}).toUpperCase():'—';}
function postNum(p,i){return Number.isInteger(p.number)&&p.number>0?p.number:i+1;}
function typeOf(item){const explicit=String(item?.type||'').toLowerCase();if(explicit)return explicit;const s=safeUrl(item?.src).split('?')[0].toLowerCase();const e=s.includes('.')?s.split('.').pop():'';if(['jpg','jpeg','png','webp','avif','svg'].includes(e))return'image';if(e==='gif')return'gif';if(['mp4','webm','mov','m4v'].includes(e))return'video';if(['mp3','wav','ogg','m4a'].includes(e))return'audio';if(e==='pdf')return'pdf';return'file';}
function renderMedia(item,context){const src=safeUrl(item?.src);if(!src)return'';const t=typeOf(item);const cap=item?.caption?'<div class="caption">'+esc(item.caption)+'</div>':'';if(t==='image'||t==='gif')return'<img src="'+esc(src)+'" alt="'+esc(item?.alt||item?.caption||'Blog image')+'">'+cap;if(t==='video')return'<video src="'+esc(src)+'" controls preload="metadata"></video>'+cap;if(t==='audio')return'<audio src="'+esc(src)+'" controls preload="metadata"></audio>'+cap;if(t==='pdf')return'<div class="file-card"><strong>'+esc(item?.name||'Document')+'</strong><small>PDF document</small><a class="download" href="'+esc(src)+'" target="_blank" rel="noopener">Open / Download</a><iframe class="pdf" src="'+esc(src)+'" title="'+esc(item?.name||'PDF document')+'"></iframe></div>';return'<div class="file-card"><strong>'+esc(item?.name||'Download file')+'</strong><small>'+esc(item?.label||'Attached file')+'</small><a class="download" href="'+esc(src)+'" target="_blank" rel="noopener" download>Download</a></div>';}
function contentBlock(b){if(!b||typeof b!=='object')return'';const t=String(b.type||'paragraph').toLowerCase();if(t==='paragraph')return'<p>'+esc(b.text||'')+'</p>';if(t==='heading'||t==='h2')return'<h2>'+esc(b.text||'')+'</h2>';if(t==='subheading'||t==='h3')return'<h3>'+esc(b.text||'')+'</h3>';if(t==='quote'||t==='blockquote')return'<blockquote>'+esc(b.text||'')+'</blockquote>';if(t==='image'||t==='gif'||t==='video'||t==='audio'||t==='pdf'||t==='file')return renderMedia(b,'content');if(t==='list'){const items=Array.isArray(b.items)?b.items:[];return'<ul>'+items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}return'';}
function coverMarkup(p){return p.cover?'<div class="featured-cover"><img src="'+esc(safeUrl(p.cover))+'" alt="'+esc(p.title||'Blog cover')+'"></div>':'';}
function applyTheme(){let saved='';try{saved=localStorage.getItem('shashank-blog-theme')||'';}catch(e){}if(saved==='light')document.body.classList.add('light');$('themeBtn').textContent=document.body.classList.contains('light')?'DARK MODE':'LIGHT MODE';}
function toggleTheme(){const light=document.body.classList.toggle('light');try{localStorage.setItem('shashank-blog-theme',light?'light':'dark');}catch(e){}$('themeBtn').textContent=light?'DARK MODE':'LIGHT MODE';}
function normalized(data){
 const s=data&&typeof data.site==='object'?data.site:{};
 const st=data&&typeof data.settings==='object'?data.settings:{};
 let arr=Array.isArray(s.posts)?s.posts:Array.isArray(data?.posts)?data.posts:Array.isArray(data?.blogs)?data.blogs:[];
 if(data&&data.featured&&typeof data.featured==='object'){const f=data.featured;if(!arr.some(p=>p&&p.id===f.id))arr=[f,...arr];else arr=arr.map(p=>p.id===f.id?({...p,...f,featured:true}):p);}
 return {site:s,settings:st,posts:arr};
}
function render(){
 $('pageTitle').textContent=site.title||'Shashank — Blog';$('metaDescription').setAttribute('content',site.description||'Shashank Shekhar — public blog.');$('intro').textContent=site.subtitle||'Ideas, experiments, observations and things worth keeping.';
 const about=String(site.about||'').split(/\n\s*\n/).filter(Boolean);$('about').innerHTML=about.length?about.map(p=>'<p>'+esc(p)+'</p>').join(''):'<p>A public place for Shashank Shekhar to share ideas, experiments, observations and things worth keeping.</p>';
 posts=posts.filter(p=>p&&p.published!==false).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map((p,i)=>({...p,number:postNum(p,i)}));
 $('count').textContent=String(posts.length);$('postCount').textContent=posts.length+' POST'+(posts.length===1?'':'S');$('latest').textContent=posts[0]?dateShort(posts[0].date):'—';$('year').textContent=new Date().getFullYear();
 const cats=[...new Set(posts.map(p=>String(p.category||'BLOG').trim()).filter(Boolean))];$('category').innerHTML='<option value="all">All categories</option>'+cats.map(c=>'<option value="'+esc(c.toLowerCase())+'">'+esc(c)+'</option>').join('');
 const featured=posts.find(p=>p.featured)||posts[0];
 $('featured').innerHTML=featured?'<article class="featured"><a class="featured-link" href="#'+encodeURIComponent(featured.id)+'" data-open="'+esc(featured.id)+'"><h2 class="featured-title">'+esc(featured.title)+'</h2><p class="excerpt">'+esc(featured.excerpt||'')+'</p><div class="meta"><span>'+dateLong(featured.date)+'</span><span class="dot">·</span><span>'+esc(featured.category||'BLOG')+'</span><span class="dot">·</span><span>'+esc(featured.readTime||'')+'</span><span class="dot">·</span><span>POST #'+String(featured.number).padStart(3,'0')+'</span></div>'+coverMarkup(featured)+'</a></article>':'<div class="empty">No published posts yet.</div>';
 renderPosts();
}
function renderPosts(){
 const q=$('search').value.trim().toLowerCase();const cat=$('category').value;const filtered=posts.filter(p=>{const hay=[p.title,p.excerpt,p.category].map(x=>String(x||'').toLowerCase()).join(' ');return (!q||hay.includes(q))&&(cat==='all'||String(p.category||'BLOG').toLowerCase()===cat);});
 $('posts').innerHTML=filtered.length?filtered.map(p=>'<article class="post"><div class="post-number">#'+String(p.number).padStart(3,'0')+'<span class="post-date">'+dateShort(p.date)+'</span></div><a class="post-link" href="#'+encodeURIComponent(p.id)+'" data-open="'+esc(p.id)+'"><h3 class="post-title">'+esc(p.title)+'</h3><p class="post-excerpt">'+esc(p.excerpt||'')+'</p><div class="meta"><span>'+esc(p.category||'BLOG')+'</span><span class="dot">·</span><span>'+esc(p.readTime||'')+'</span></div></a></article>').join(''):'<div class="empty">No posts match that search.</div>';
 document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{e.preventDefault();const p=posts.find(x=>x.id===el.dataset.open);if(p)openPost(p);});
}
function openPost(p){
 const idx=posts.findIndex(x=>x.id===p.id);const prev=idx>0?posts[idx-1]:null;const next=idx<posts.length-1?posts[idx+1]:null;
 $('article').innerHTML='<div class="section-label">POST #'+String(p.number).padStart(3,'0')+' / '+esc(p.category||'BLOG')+'</div><h1>'+esc(p.title)+'</h1><p class="excerpt">'+esc(p.excerpt||'')+'</p><div class="meta"><span>'+dateLong(p.date)+'</span><span class="dot">·</span><span>'+esc(p.readTime||'')+'</span></div>'+(p.cover?'<div class="post-cover"><img src="'+esc(safeUrl(p.cover))+'" alt="'+esc(p.title||'Blog cover')+'"></div>':'')+'<div class="article-content">'+(Array.isArray(p.content)?p.content.map(contentBlock).join(''):'')+'</div>'+(Array.isArray(p.media)&&p.media.length?'<div class="section-label">ATTACHED FILES</div>'+p.media.map(x=>renderMedia(x,'media')).join(''):'')+'<div class="article-nav">'+(next?'<a href="#'+encodeURIComponent(next.id)+'" data-open-reader="'+esc(next.id)+'">← '+esc(next.title)+'</a>':'<span></span>')+(prev?'<a href="#'+encodeURIComponent(prev.id)+'" data-open-reader="'+esc(prev.id)+'">'+esc(prev.title)+' →</a>':'<span></span>')+'</div>';
 $('reader').classList.add('open');$('reader').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';history.replaceState(null,'','#'+encodeURIComponent(p.id));$('article').querySelectorAll('[data-open-reader]').forEach(el=>el.onclick=e=>{e.preventDefault();const x=posts.find(z=>z.id===el.dataset.openReader);if(x)openPost(x);});$('reader').scrollTop=0;
}
function closeReader(){ $('reader').classList.remove('open');$('reader').setAttribute('aria-hidden','true');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search);}
async function load(){
 try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();const n=normalized(data);site=n.site;settings=n.settings;posts=n.posts;render();const hash=decodeURIComponent(location.hash.slice(1));if(hash){const p=posts.find(x=>x.id===hash);if(p)openPost(p);}}catch(err){console.error(err);$('featured').innerHTML='<div class="error"><strong>Blog posts could not be loaded.</strong><br>Make sure <code>blogs.json</code> is in the same <code>blog</code> folder as this page, then refresh.</div>';}}
applyTheme();$('themeBtn').addEventListener('click',toggleTheme);$('closeBtn').addEventListener('click',closeReader);$('search').addEventListener('input',renderPosts);$('category').addEventListener('change',renderPosts);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('reader').classList.contains('open'))closeReader();});load();
})();
</script>
</body>
</html>
