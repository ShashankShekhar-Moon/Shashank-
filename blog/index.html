<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" id="metaDescription" content="Shashank Shekhar — a personal blog about ideas, experiments, learning and things worth keeping.">
<title id="pageTitle">Shashank — Blog</title>
<style>
:root{color-scheme:dark;--bg:#050505;--surface:#080908;--surface2:#0b0b0b;--ink:#f4f4ef;--soft:#a7aaa3;--muted:#73786f;--line:#272a26;--accent:#b8ff4a}
body.light{color-scheme:light;--bg:#f3f4ef;--surface:#eef0eb;--surface2:#fff;--ink:#171a17;--soft:#555c55;--muted:#697069;--line:#cbd0c8;--accent:#5f8f20}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.7}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}::selection{background:var(--accent);color:var(--bg)}
.topbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:20;background:rgba(5,5,5,.93);backdrop-filter:blur(14px)}body.light .topbar{background:rgba(243,244,239,.93)}.brand{font-weight:950;letter-spacing:-.06em}.brand span{color:var(--accent)}.nav{display:flex;gap:8px;align-items:center}.nav a,.theme-btn,.back-btn{border:1px solid var(--line);background:transparent;color:var(--soft);padding:9px 12px;border-radius:4px;font:800 9px ui-monospace,SFMono-Regular,monospace;letter-spacing:.12em;text-transform:uppercase}.nav a:hover,.theme-btn:hover,.back-btn:hover{border-color:var(--accent);color:var(--accent)}
.wrap{width:min(940px,88vw);margin:0 auto}.hero{padding:100px 0 78px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);font:900 10px ui-monospace,SFMono-Regular,monospace;letter-spacing:.2em;text-transform:uppercase}.hero h1{font-size:clamp(4rem,11vw,8.6rem);line-height:.82;letter-spacing:-.095em;margin:24px 0 0;max-width:880px}.hero h1 span{color:var(--accent)}.intro{max-width:720px;color:var(--soft);font-size:clamp(1rem,1.7vw,1.18rem);line-height:1.85;margin:34px 0 0}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:32px;color:var(--muted);font:800 9px ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase}.stats strong{color:var(--ink)}
.section{padding:76px 0}.label{color:var(--accent);font:900 9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;margin-bottom:22px}.featured{border-top:1px solid var(--line);padding-top:28px}.featured h2{font-size:clamp(2.6rem,6.4vw,5.4rem);line-height:.96;letter-spacing:-.075em;margin:0;transition:.18s}.featured:hover h2{color:var(--accent)}.excerpt{max-width:720px;color:var(--soft);font-size:1.05rem;margin:20px 0 0;line-height:1.75}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font:800 9px ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;margin-top:20px}.dot{color:var(--accent)}
.journal-head{border-bottom:1px solid var(--line);padding-bottom:18px;display:flex;align-items:end;justify-content:space-between;gap:16px}.journal-head h2{font-size:clamp(2.1rem,5vw,4rem);letter-spacing:-.07em;line-height:.9;margin:0}.journal-head span{color:var(--muted);font:800 9px ui-monospace,monospace;letter-spacing:.12em}.post{display:grid;grid-template-columns:110px 1fr;gap:32px;padding:28px 0;border-bottom:1px solid var(--line)}.post-no{color:var(--muted);font:900 10px ui-monospace,monospace;letter-spacing:.12em}.post-date{display:block;margin-top:7px;color:var(--muted);font:700 9px ui-monospace,monospace;line-height:1.4}.post-title{font-size:clamp(1.65rem,3vw,2.6rem);line-height:1.02;letter-spacing:-.055em;margin:0;transition:.18s}.post:hover .post-title{color:var(--accent)}.post-excerpt{color:var(--soft);margin:10px 0 0;line-height:1.65}
.cover{margin-top:30px;border:1px solid var(--line);background:var(--surface);overflow:hidden}.cover img,.cover video{width:100%;display:block;max-height:560px;object-fit:cover}.cover-empty{min-height:250px;display:grid;place-items:center;color:var(--accent);font:950 72px ui-monospace,monospace;letter-spacing:-.12em;background:radial-gradient(circle at 70% 20%,rgba(184,255,74,.11),transparent 40%)}
.about{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:70px 0}.about-grid{display:grid;grid-template-columns:170px 1fr;gap:48px}.about-label{color:var(--accent);font:900 9px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase}.about-copy{color:var(--soft);font-size:1.05rem;line-height:1.85}.about-copy p{margin:0}.about-copy p+p{margin-top:18px}footer{padding:34px 0 55px;color:var(--muted);font-size:11px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}footer strong{color:var(--ink)}
.reader{position:fixed;inset:0;z-index:100;display:none;overflow:auto;background:var(--bg)}.reader.open{display:block}.readerbar{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5vw;position:sticky;top:0;z-index:2;background:rgba(5,5,5,.95);backdrop-filter:blur(14px)}body.light .readerbar{background:rgba(243,244,239,.95)}.article{width:min(760px,88vw);margin:auto;padding:76px 0 110px}.article h1{font-size:clamp(3rem,8vw,6.6rem);line-height:.86;letter-spacing:-.09em;margin:18px 0}.article .excerpt{font-size:1.12rem}.article-content{padding-top:24px}.article-content p{color:var(--soft);font-size:1.09rem;line-height:1.9;margin:28px 0}.article-content h2{font-size:2rem;line-height:1;letter-spacing:-.05em;margin:54px 0 14px}.article-content blockquote{border-left:2px solid var(--accent);padding-left:20px;color:var(--ink);font-size:1.18rem;line-height:1.7;margin:40px 0}.article-content ul{color:var(--soft);padding-left:24px;line-height:1.9}.article-content img,.article-content video{width:100%;display:block;max-height:720px;object-fit:contain;background:#000;border:1px solid var(--line);margin:34px 0}.article-content audio{width:100%}.media{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:35px 0}.media-label{color:var(--accent);font:900 9px ui-monospace,monospace;letter-spacing:.14em;margin-bottom:12px}.pdf{display:block;width:100%;height:650px;border:1px solid var(--line);background:#fff}.download{display:inline-block;margin-top:12px;border:1px solid var(--line);padding:9px 12px;font:800 9px ui-monospace,monospace;letter-spacing:.1em}.download:hover{border-color:var(--accent);color:var(--accent)}.error{padding:40px 0;color:var(--muted);border-top:1px solid var(--line)}
@media(max-width:650px){.topbar{height:64px;padding:0 18px}.nav a{display:none}.wrap{width:88vw}.hero{padding:76px 0 62px}.post{grid-template-columns:1fr;gap:8px}.post-date{display:inline;margin-left:10px}.journal-head{align-items:flex-start;flex-direction:column}.about-grid{grid-template-columns:1fr;gap:18px}.article{padding-top:54px}}
</style>
</head>
<body>
<header class="topbar"><a class="brand" href="../">SHASHANK<span>.</span></a><nav class="nav"><a href="../">MAIN SITE</a><a href="#journal">JOURNAL</a><button class="theme-btn" id="themeBtn" type="button">LIGHT MODE</button></nav></header>
<main>
  <section class="hero"><div class="wrap"><div class="eyebrow">A PERSONAL BLOG BY SHASHANK SHEKHAR</div><h1>THINGS I<br><span>NOTICE.</span></h1><p class="intro" id="intro"></p><div class="stats"><span>POSTS <strong id="count">0</strong></span><span>LATEST <strong id="latest">—</strong></span><span>FROM EARTH / THE INTERNET</span></div></div></section>
  <section class="section"><div class="wrap"><div class="label">01 / FEATURED</div><div id="featured"></div></div></section>
  <section class="section" id="journal"><div class="wrap"><div class="journal-head"><h2>THE JOURNAL.</h2><span id="journalCount">0 POSTS</span></div><div id="posts"></div></div></section>
  <section class="about"><div class="wrap about-grid"><div class="about-label">ABOUT THIS PLACE</div><div class="about-copy" id="about"></div></div></section>
</main>
<footer class="wrap"><div><strong>Shashank Shekhar</strong> · A little corner of the internet.</div><div>© <span id="year"></span></div></footer>
<div class="reader" id="reader" aria-hidden="true"><div class="readerbar"><a class="brand" href="../">SHASHANK<span>.</span></a><button class="back-btn" id="closeBtn" type="button">← BACK TO JOURNAL</button></div><article class="article" id="article"></article></div>
<script>
(function(){
'use strict';
const DATA_URL='blogs.json';
const $=id=>document.getElementById(id);
let site={};
let posts=[];

function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safeUrl(value){return String(value||'').trim().replace(/["'<>\\\s]/g,'');}
function parseDate(value){const d=new Date(String(value||'')+'T00:00:00');return Number.isNaN(d.getTime())?null:d;}
function formatDate(value){const d=parseDate(value);return d?d.toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'}):'—';}
function formatShortDate(value){const d=parseDate(value);return d?d.toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}).toUpperCase():'—';}
function mediaType(item){const type=String(item?.type||'').toLowerCase();if(type)return type;const path=safeUrl(item?.src).split('?')[0];const ext=path.includes('.')?path.split('.').pop().toLowerCase():'';if(['jpg','jpeg','png','webp','avif','svg'].includes(ext))return'image';if(ext==='gif')return'gif';if(['mp4','webm','mov','m4v'].includes(ext))return'video';if(['mp3','wav','ogg','m4a'].includes(ext))return'audio';if(ext==='pdf')return'pdf';return'file';}
function coverMarkup(post){if(!post.cover)return'<div class="cover"><div class="cover-empty">SH.</div></div>';const url=esc(safeUrl(post.cover));return'<div class="cover">'+(mediaType({src:post.cover})==='video'?'<video src="'+url+'" autoplay muted loop playsinline preload="metadata"></video>':'<img src="'+url+'" alt="'+esc(post.title)+'" loading="lazy">')+'</div>';}
function contentBlock(item){if(!item||!item.type)return'';const type=String(item.type).toLowerCase();if(type==='paragraph'||type==='text')return'<p>'+esc(item.text)+'</p>';if(type==='heading')return'<h2>'+esc(item.text)+'</h2>';if(type==='quote')return'<blockquote>'+esc(item.text)+'</blockquote>';if(type==='list')return'<ul>'+((Array.isArray(item.items)?item.items:[]).map(x=>'<li>'+esc(x)+'</li>').join(''))+'</ul>';if(type==='image'||type==='gif')return'<img src="'+esc(safeUrl(item.src))+'" alt="'+esc(item.alt||'')+'" loading="lazy">';if(type==='video')return'<video controls playsinline preload="metadata" src="'+esc(safeUrl(item.src))+'"></video>';if(type==='audio')return'<div class="media"><div class="media-label">AUDIO</div><audio controls preload="metadata" src="'+esc(safeUrl(item.src))+'"></audio></div>';if(type==='pdf'){const url=esc(safeUrl(item.src));return'<div class="media"><div class="media-label">DOCUMENT</div><iframe class="pdf" src="'+url+'" title="'+esc(item.name||'PDF document')+'"></iframe><a class="download" href="'+url+'" target="_blank" rel="noopener">OPEN / DOWNLOAD PDF ↗</a></div>';}if(type==='file'){const url=esc(safeUrl(item.src));return'<div class="media"><div class="media-label">FILE</div><p>'+esc(item.name||'Downloadable file')+'</p><a class="download" href="'+url+'" target="_blank" rel="noopener" download>OPEN / DOWNLOAD ↗</a></div>';}return'';}
function openPost(post){$('article').innerHTML='<div class="eyebrow">'+esc(post.category||'BLOG')+'</div><h1>'+esc(post.title)+'</h1><p class="excerpt">'+esc(post.excerpt||'')+'</p><div class="meta"><span>'+formatShortDate(post.date)+'</span><span class="dot">·</span><span>'+esc(post.readTime||'')+'</span><span class="dot">·</span><span>POST #'+String(post.number).padStart(3,'0')+'</span></div>'+(post.cover?coverMarkup(post):'')+'<div class="article-content">'+(Array.isArray(post.content)?post.content.map(contentBlock).join(''):'')+'</div>';$('reader').classList.add('open');$('reader').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';window.scrollTo(0,0);}
function closeReader(){ $('reader').classList.remove('open');$('reader').setAttribute('aria-hidden','true');document.body.style.overflow='';if(location.hash)history.replaceState(null,'',location.pathname+location.search);}
function render(){
  $('pageTitle').textContent=site.title||'Shashank — Blog';
  $('metaDescription').setAttribute('content',site.description||'Shashank Shekhar — personal blog.');
  $('intro').textContent=site.subtitle||'';
  $('about').innerHTML=String(site.about||'').split(/\n\s*\n/).filter(Boolean).map(p=>'<p>'+esc(p)+'</p>').join('');
  posts=(Array.isArray(site.posts)?site.posts:[]).filter(p=>p&&p.published!==false).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).map((p,i)=>({...p,number:Number.isInteger(p.number)&&p.number>0?p.number:i+1}));
  $('count').textContent=String(posts.length);$('journalCount').textContent=posts.length+' POST'+(posts.length===1?'':'S');$('latest').textContent=posts[0]?formatShortDate(posts[0].date):'—';$('year').textContent=new Date().getFullYear();
  const featured=posts.find(p=>p.featured)||posts[0];
  $('featured').innerHTML=featured?'<article class="featured"><a href="#'+encodeURIComponent(featured.id)+'" data-open="'+esc(featured.id)+'"><h2>'+esc(featured.title)+'</h2><p class="excerpt">'+esc(featured.excerpt||'')+'</p><div class="meta"><span>'+formatDate(featured.date)+'</span><span class="dot">·</span><span>'+esc(featured.readTime||'')+'</span><span class="dot">·</span><span>POST #'+String(featured.number).padStart(3,'0')+'</span></div>'+(featured.cover?coverMarkup(featured):'')+'</a></article>':'<div class="error">Nothing published yet.</div>';
  $('posts').innerHTML=posts.length?posts.map(p=>'<article class="post"><div class="post-no">#'+String(p.number).padStart(3,'0')+'<span class="post-date">'+formatShortDate(p.date)+'</span></div><a href="#'+encodeURIComponent(p.id)+'" data-open="'+esc(p.id)+'"><h3 class="post-title">'+esc(p.title)+'</h3><p class="post-excerpt">'+esc(p.excerpt||'')+'</p><div class="meta"><span>'+esc(p.category||'BLOG')+'</span><span class="dot">·</span><span>'+esc(p.readTime||'')+'</span></div></a></article>').join(''):'<div class="error">Nothing published yet.</div>';
  document.querySelectorAll('[data-open]').forEach(link=>link.addEventListener('click',e=>{e.preventDefault();const p=posts.find(x=>x.id===link.dataset.open);if(p)openPost(p);}));
  const hash=decodeURIComponent(location.hash.slice(1));if(hash){const p=posts.find(x=>x.id===hash);if(p)openPost(p);}
}

const themeKey='shashank-blog-theme';let saved='';try{saved=localStorage.getItem(themeKey)||'';}catch(e){}if(saved==='light')document.body.classList.add('light');$('themeBtn').textContent=document.body.classList.contains('light')?'DARK MODE':'LIGHT MODE';$('themeBtn').addEventListener('click',()=>{const light=document.body.classList.toggle('light');try{localStorage.setItem(themeKey,light?'light':'dark');}catch(e){}$('themeBtn').textContent=light?'DARK MODE':'LIGHT MODE';});
$('closeBtn').addEventListener('click',closeReader);window.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('reader').classList.contains('open'))closeReader();});
fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Could not load blogs.json');return r.json();}).then(data=>{site=data&&data.site&&typeof data.site==='object'?data.site:{};render();}).catch(error=>{console.error(error);$('featured').innerHTML='<div class="error">The journal is temporarily unavailable. Please check that <strong>blogs.json</strong> is in the same folder as this page.</div>';});
})();
</script>
</body>
</html>
